<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AI Case Intelligent is an AI workbench for Indian litigation practice: chronologies, research, authority checks, drafting, translation and case tracking in one place.">
<meta name="theme-color" content="#0b1220">
<title>AI Case Intelligent</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-scales" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M12 6l-6 1.5M12 6l6 1.5M6 7.5 3 15h6L6 7.5ZM18 7.5 15 15h6l-3-7.5ZM3 15a3 3 0 0 0 6 0M15 15a3 3 0 0 0 6 0"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 18h8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-shield-check" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8.3 8 9 4.6-.7 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z"/></symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3ZM19 15l.9 2.1 2.1.9-2.1.9L19 21l-.9-2.1-2.1-.9 2.1-.9L19 15ZM5 14l.7 1.6 1.6.7-1.6.7L5 18.6l-.7-1.6-1.6-.7 1.6-.7L5 14Z"/></symbol>
  <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
  <symbol id="i-gavel" viewBox="0 0 24 24"><path d="m14 4 6 6M17 1l6 6M11 7l6 6M4 21h10M6.5 18.5 15 10M2.5 14.5 9 8"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 19a2 2 0 0 1 2-2h13v4H6a2 2 0 0 1-2-2ZM8 7h7M8 11h7"/></symbol>
  <symbol id="i-swords" viewBox="0 0 24 24"><path d="M14.5 14.5 20 20l1-3-3-1-5.5-5.5M9.5 14.5 4 20l-1-3 3-1 5.5-5.5"/><path d="M3 3h4l9 9M21 3h-4l-9 9"/></symbol>
  <symbol id="i-summary" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0 4-4m-4 4-4-4"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1L18 7"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7 3 3 7L21 3Z"/><path d="m10 13.5 4-4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-quote" viewBox="0 0 24 24"><path d="M9 7H5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2v1a3 3 0 0 1-3 3M19 7h-4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h2v1a3 3 0 0 1-3 3"/></symbol>
</svg>

<div id="boot" class="boot">
  <div class="boot__mark"><svg class="ico"><use href="#i-scales"/></svg></div>
  <p class="boot__text">Starting AI Case Intelligent</p>
</div>

<div class="app" id="app" hidden>
  <div class="progress" id="progress" aria-hidden="true"><span></span></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__head">
      <a class="brand" href="#/dashboard">
        <span class="brand__mark"><svg class="ico"><use href="#i-scales"/></svg></span>
        <span class="brand__text">
          <strong>AI Case Intelligence</strong>
        </span>
      </a>
      <button class="icon-btn sidebar__close" id="sidebarClose" aria-label="Close menu">
        <svg class="ico"><use href="#i-x"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Tools"></nav>
    <div class="sidebar__foot">
      <button class="provider-chip" id="providerChip" type="button">
        <span class="provider-chip__dot" id="providerDot"></span>
        <span class="provider-chip__body">
          <span class="provider-chip__name" id="providerName">Loading</span>
          <span class="provider-chip__model" id="providerModel">please wait</span>
        </span>
        <svg class="ico provider-chip__caret"><use href="#i-chevron"/></svg>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn topbar__menu" id="menuBtn" aria-label="Open menu">
        <svg class="ico"><use href="#i-menu"/></svg>
      </button>
      <div class="topbar__title">
        <h1 id="viewTitle">Dashboard</h1>
        <p id="viewSubtitle">Ten litigation tools in one workspace.</p>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--ghost btn--sm" id="modelBtn" type="button">
          <svg class="ico"><use href="#i-cpu"/></svg>
          <span id="modelBtnLabel">Model</span>
        </button>
        <button class="icon-btn" id="keysBtn" type="button" aria-label="API keys" title="API keys">
          <svg class="ico"><use href="#i-shield-check"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Switch theme">
          <svg class="ico ico--sun"><use href="#i-sun"/></svg>
          <svg class="ico ico--moon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal__head">
      <h2 id="modalTitle">Title</h2>
      <button class="icon-btn" data-close aria-label="Close">
        <svg class="ico"><use href="#i-x"/></svg>
      </button>
    </header>
    <div class="modal__body" id="modalBody"></div>
    <footer class="modal__foot" id="modalFoot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
